name: Python

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check python/

  unit-test:
    name: Python unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest
          find python -name "requirements.txt" -exec pip install -r {} \;
      - name: Run each script's test_*.py
        run: |
          fail=0
          for t in $(find python -name 'test_*.py' | sort); do
            echo "::group::$t"
            if ! python3 "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
