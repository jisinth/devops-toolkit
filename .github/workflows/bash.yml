name: Bash

on:
  push:
    paths:
      - "bash/**"
      - ".github/workflows/bash.yml"
  pull_request:
    paths:
      - "bash/**"
      - ".github/workflows/bash.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./bash"

  unit-test:
    name: Bash unit tests
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Run each script's test.sh
        run: |
          fail=0
          for t in $(find bash -name 'test.sh' | sort); do
            echo "::group::$t"
            chmod +x "$t"
            if ! bash "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
