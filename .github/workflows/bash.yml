name: Bash

on:
  push:
    paths:
      - "bash/**"
      - ".github/workflows/bash.yml"
  pull_request:
    paths:
      - "bash/**"
      - ".github/workflows/bash.yml"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./bash"

  unit-test:
    name: Bash unit tests
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: |
          if [ -d tests ] && find tests -name "*.bats" | grep -q .; then
            bats tests
          else
            echo "No bats tests found yet, skipping."
          fi
